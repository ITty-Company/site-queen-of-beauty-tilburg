<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96" role="img" aria-labelledby="t">
  <title id="t">Queen of Beauty — Tilburg</title>
  <defs>
    <style>
      .ink{fill:#1D1519}.red{fill:#B5172F}
      .w{font-family:'Fraunces','Times New Roman',serif;font-variation-settings:'opsz' 144}
      .idx{font-family:'Fraunces',serif;font-weight:700;font-size:15px}
      .mono{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:9px;letter-spacing:2.6px}
    </style>
    <!-- hart: één pad, ook gebruikt als index-pip -->
    <path id="h" d="M0 3.2C0 1.2 1.5 0 3.1 0 4.3 0 5.3.7 6 1.8 6.7.7 7.7 0 8.9 0 10.5 0 12 1.2 12 3.2 12 6.6 7.6 9.4 6 11 4.4 9.4 0 6.6 0 3.2Z"/>
    <!-- halve kaart-index: Q + hart; tweede helft 180° gedraaid (puntsymmetrie van een speelkaart) -->
    <g id="corner"><text class="idx red" x="15" y="27">Q</text><use href="#h" class="red" transform="translate(15.5 31) scale(.72)"/></g>
  </defs>
  <!-- de kaart: lichte tilt, als net getrokken -->
  <g transform="rotate(-6 38 48)">
    <rect x="9" y="7" width="58" height="82" rx="7" fill="#F6EFEA" stroke="#1D1519" stroke-width="2"/>
    <rect x="14" y="12" width="48" height="72" rx="4" fill="none" stroke="#B5172F" stroke-width=".8" stroke-dasharray="1.5 2"/>
    <use href="#corner"/>
    <use href="#corner" transform="rotate(180 38 48)"/>
    <!-- kroon met harten als punten: Queen = hartenvrouw -->
    <path class="ink" d="M26 55 L24 41 L31.5 47 L38 37.5 L44.5 47 L52 41 L50 55 Z"/>
    <rect class="ink" x="26" y="56.5" width="24" height="3" rx="1"/>
    <use href="#h" class="red" transform="translate(21 36.6) scale(.5)"/>
    <use href="#h" class="red" transform="translate(35 32.2) scale(.5)"/>
    <use href="#h" class="red" transform="translate(49 36.6) scale(.5)"/>
  </g>
  <!-- woordmerk -->
  <text class="w ink" x="84" y="54" font-size="44" font-weight="600" letter-spacing="-1.2">Queen</text>
  <text class="w red" x="218" y="54" font-size="36" font-weight="400" font-style="italic" letter-spacing="-.6">of Beauty</text>
  <rect class="red" x="86" y="66" width="22" height="1.4"/>
  <text class="mono ink" x="116" y="70">BESTERDRING 80 · TILBURG</text>
</svg>
